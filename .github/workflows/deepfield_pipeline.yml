name: DeepFieldPro CI/CD & Validation Pipeline

on:
  push:
    branches: [ "main", "develop", "research/*" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Run full validation suite daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_shadow_simulation:
        description: 'Run extended shadow simulation (45 mins)'
        required: false
        default: 'false'
      run_full_backtest:
        description: 'Run full historical backtest suite'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.10'
  POSTGRES_DB: 'deepfield_test'
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres'
  POSTGRES_HOST: 'localhost'
  REDIS_HOST: 'localhost'
  ENVIRONMENT: 'ci'
  LOG_LEVEL: 'INFO'

jobs:
  # ---------------------------------------------------------
  # JOB 1: Code Quality & Static Analysis
  # ---------------------------------------------------------
  code-quality:
    name: 🧹 Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest black

      - name: Lint with Ruff
        run: |
          ruff check src/ --output-format=github

      - name: Format Check with Black
        run: |
          black --check src/

      - name: Type Check with MyPy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary

  # ---------------------------------------------------------
  # JOB 2: Infrastructure & Database Setup
  # ---------------------------------------------------------
  infrastructure-test:
    name: 🏗 Infrastructure & DB Setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-randr0 libxrender1 libx11-xcb1 libxkbcommon0 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libatspi2.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libnss3 libnspr4

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt
          # Add psycopg2-binary to the explicit installs here
          pip install pytest pytest-asyncio pytest-cov fakeredis pytest-postgresql psycopg2-binary

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://${{ env.REDIS_HOST }}:6379/0
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m database.migrate

      - name: Verify Infrastructure Connectivity
        run: |
          python -c "import psycopg2; psycopg2.connect('postgresql://postgres:postgres@localhost:5432/deepfield_test'); print('DB OK')"
          python -c "import redis; r = redis.Redis(host='localhost', port=6379); r.ping(); print('Redis OK')"

  # ---------------------------------------------------------
  # JOB 3: Unit & Integration Tests
  # ---------------------------------------------------------
  test-suite:
    name: 🧪 Unit & Integration Tests
    needs: [infrastructure-test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright pytest pytest-asyncio pytest-cov
          playwright install chromium
          playwright install-deps chromium

      - name: Run Unit Tests (Core Logic)
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://${{ env.REDIS_HOST }}:6379/0
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Run Integration Tests (Browser & Session)
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://${{ env.REDIS_HOST }}:6379/0
          HEADLESS: "true"
        run: |
          pytest tests/integration/test_browser_engine.py tests/integration/test_session_manager.py -v --timeout=300

      - name: Run Research OS Tests (Walk-Forward & Monte Carlo)
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
        run: |
          pytest tests/research/test_walk_forward.py tests/research/test_monte_carlo.py -v --timeout=600

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------
  # JOB 4: Shadow Simulation (Live Ops Validation)
  # ---------------------------------------------------------
  shadow-simulation:
    name: 🌑 Shadow Mode Simulation
    needs: [test-suite]
    if: github.event_name == 'schedule' || github.event.inputs.run_shadow_simulation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Seed Historical Data for Simulation
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
        run: |
          python src/scripts/seed_test_data.py --days 30

      - name: Run Shadow Deployment Orchestrator (Simulation Mode)
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://${{ env.REDIS_HOST }}:6379/0
          MODE: "shadow_simulation"
          SIMULATION_DURATION_MINUTES: "45"
        run: |
          echo "Starting 45-minute shadow simulation..."
          python src/live_operations/shadow_deployment_orchestrator.py --simulate --duration 45

      - name: Analyze Shadow Results
        run: |
          python src/scripts/analyze_shadow_results.py --output report.json

      - name: Upload Shadow Report
        uses: actions/upload-artifact@v3
        with:
          name: shadow-simulation-report
          path: report.json

  # ---------------------------------------------------------
  # JOB 5: Full Historical Backtest (Optional/Heavy)
  # ---------------------------------------------------------
  full-backtest:
    name: 📜 Full Historical Backtest
    needs: [test-suite]
    if: github.event_name == 'schedule' || github.event.inputs.run_full_backtest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports: [5432:5432]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Walk-Forward Validation Suite
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@${{ env.POSTGRES_HOST }}:5432/${{ env.POSTGRES_DB }}
        run: |
          python src/research/walk_forward_validator.py --full-scan --output results/wf_report.json

      - name: Run Monte Carlo Simulations
        run: |
          python src/research/monte_carlo_engine.py --simulations 10000 --output results/mc_report.json

      - name: Upload Backtest Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backtest-results
          path: results/

  # ---------------------------------------------------------
  # JOB 6: Docker Build & Push (If Main Branch)
  # ---------------------------------------------------------
  docker-build:
    name: 🐳 Docker Build & Push
    needs: [code-quality, test-suite]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Core Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/core:latest
            ghcr.io/${{ github.repository }}/core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Browser Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.browser
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/browser-worker:latest
            ghcr.io/${{ github.repository }}/browser-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # JOB 7: Notification & Summary
  # ---------------------------------------------------------
  notify:
    name: 🔔 Notification & Summary
    needs: [code-quality, test-suite, shadow-simulation, full-backtest, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## DeepFieldPro CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test-suite.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Shadow Sim**: ${{ needs.shadow-simulation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backtest**: ${{ needs.full-backtest.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy**: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-suite.result }}" == "failure" ]; then
            echo "❌ Critical Tests Failed. Deployment halted." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All critical checks passed." >> $GITHUB_STEP_SUMMARY
          fi
