version: '3.8'

services:
  daemon:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: deepfield_daemon
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: python src/live_predictions_daemon.py
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: deepfield_dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: python src/live_dashboard_server.py
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
